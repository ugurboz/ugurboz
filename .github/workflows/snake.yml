name: Generate Snake

on:
  schedule: # Her gün saat 00:00'da otomatik çalışır
    - cron: "0 0 * * *"
  workflow_dispatch: # Manuel çalıştırma için
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate Snake
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake animation (Dark + Purple)
        uses: Platane/snk@v3
        with:
          github_user_name: ugurboz
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=purple
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark-dimmed&color_snake=#8a2be2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
