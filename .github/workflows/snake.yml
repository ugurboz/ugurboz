name: Generate Golden Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Golden Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ugurboz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFD700&color_dots=#EAEAEA,#B5B5B5,#828282,#4F4F4F,#2C2C2C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFD700&color_dots=#1A1A1A,#333333,#4D4D4D,#666666,#808080

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
